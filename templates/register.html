<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register – AI Resume Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
<div class="page">
  <header class="navbar">
    <div class="navbar-brand">AI Resume Builder</div>
    <nav class="nav-links">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('login') }}">Login</a>
    </nav>
  </header>
  <main class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Create your account</div>
        <div class="card-subtitle">Access your saved Generative AI resumes anytime.</div>
      </div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      {% if message %}
      <div class="success">{{ message }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('register') }}" id="registerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" class="form-control" required />
            <button type="button" class="btn btn-sm btn-secondary mt-1" onclick="sendEmailOTP()">Send Email OTP</button>
            <input id="email_otp" name="email_otp" type="text" class="form-control mt-1" placeholder="Enter 6-digit OTP" />
          </div>
          <div class="form-group">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" class="form-control" placeholder="+91 98765 43210" required />
            <button type="button" class="btn btn-sm btn-secondary mt-1" onclick="sendPhoneOTP()">Send Phone OTP</button>
            <input id="phone_otp" name="phone_otp" type="text" class="form-control mt-1" placeholder="Enter 6-digit OTP" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" class="form-control" required />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Register</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
